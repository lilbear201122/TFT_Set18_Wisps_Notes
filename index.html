<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFT Set 18 神火筆記</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel2: #1d2129;
  --border: #2a2f3a;
  --text: #e6e8ec;
  --text-dim: #9aa1ad;
  --text-faint: #6b7280;
  --accent: #7dd3c0;
  --chip-bg: #1d2129;
  --chip-active: #2f3541;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: min(420px, 42vw);
  height: 220px;
  z-index: 0;
  background-image: url("assets/img/choncc_bg.jpg");
  background-repeat: no-repeat;
  background-position: top right;
  background-size: cover;
  opacity: 0.85;
  -webkit-mask-image: linear-gradient(215deg, black 20%, transparent 75%);
  mask-image: linear-gradient(215deg, black 20%, transparent 75%);
  pointer-events: none;
}
.wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
h1 { font-size: 22px; margin: 0 0 6px; }
.subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 4px; }
.subtitle b { color: var(--text); font-weight: 600; }

.controls {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 18px;
  position: sticky;
  top: 0;
  z-index: 5;
  box-shadow: 0 8px 16px -8px rgba(0,0,0,0.5);
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.row:last-child { margin-bottom: 0; }
.row-label { color: var(--text-faint); font-size: 12px; width: 68px; flex-shrink: 0; }

.chip {
  background: var(--chip-bg);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: background .12s, color .12s, border-color .12s;
}
.chip:hover { border-color: #3a4150; color: var(--text); }
.chip.active { background: var(--chip-active); color: var(--text); border-color: #4a5568; font-weight: 600; }
.chip[data-cat].active { color: #0f1115; }

.chip[data-cat="商店"].active { background: #c9a86a; border-color: #c9a86a; }
.chip[data-cat="風險"].active { background: #a78bfa; border-color: #a78bfa; }
.chip[data-cat="金幣／經驗"].active { background: #8b8fe8; border-color: #8b8fe8; }
.chip[data-cat="雜項"].active { background: #4caf93; border-color: #4caf93; }
.chip[data-cat="英雄"].active { background: #e0607e; border-color: #e0607e; }
.chip[data-cat="戰鬥"].active { background: #d97757; border-color: #d97757; }
.chip[data-cat="道具"].active { background: #6fc2e0; border-color: #6fc2e0; }

.chip[data-rar="白銀"].active { background: #b9c2cc; border-color: #b9c2cc; color: #0f1115; }
.chip[data-rar="黃金"].active { background: #e0b23d; border-color: #e0b23d; color: #0f1115; }
.chip[data-rar="稜彩"].active { background: linear-gradient(90deg,#c084fc,#f472b6); border-color: #c084fc; color: #0f1115; }

.toggle { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 13px; cursor: pointer; }
.toggle input { accent-color: var(--accent); }
.toggle.push { margin-left: auto; }

#search {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  width: 220px;
  outline: none;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text-faint); }

.count { color: var(--text-faint); font-size: 12px; margin: 4px 0 12px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card-name-row { display: flex; align-items: center; gap: 8px; }
.card-icon { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; }
.card-name { font-size: 15px; font-weight: 700; }
.card-name-en { font-size: 11px; color: var(--text-faint); font-weight: 400; }
.card-cost { font-size: 13px; color: var(--accent); font-weight: 600; white-space: nowrap; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim); }
.badge.round { color: var(--text-faint); }
.badge.fresh { color: #f0a8d0; border-color: #f0a8d055; }
.badge.cat-商店 { color: #c9a86a; border-color: #c9a86a55; }
.badge.cat-風險 { color: #a78bfa; border-color: #a78bfa55; }
.badge.cat-金幣／經驗 { color: #8b8fe8; border-color: #8b8fe855; }
.badge.cat-雜項 { color: #4caf93; border-color: #4caf9355; }
.badge.cat-英雄 { color: #e0607e; border-color: #e0607e55; }
.badge.cat-戰鬥 { color: #d97757; border-color: #d9775755; }
.badge.cat-道具 { color: #6fc2e0; border-color: #6fc2e055; }
.badge.rar-白銀 { color: #b9c2cc; border-color: #b9c2cc55; }
.badge.rar-黃金 { color: #e0b23d; border-color: #e0b23d55; }
.badge.rar-稜彩 { color: #f472b6; border-color: #f472b655; }

.effects { margin: 0 0 8px; padding: 0; list-style: none; }
.effects li { font-size: 13px; margin-bottom: 3px; padding-left: 14px; position: relative; }
.effects li::before { content: "›"; position: absolute; left: 0; color: var(--text-faint); }
.effects li.upgrade { color: var(--text-dim); }
.effects li.prism { color: #f0a8d0; }

.notes { border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 8px; }
.notes div { font-size: 12px; color: var(--text-dim); margin-bottom: 3px; }
.notes .local-flag { display: inline-block; font-size: 10px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 6px; margin-bottom: 4px; }

#editModeBtn.active { background: var(--accent); border-color: var(--accent); color: #0f1115; font-weight: 700; }
#editTools { display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
#editTools .hint { color: var(--text-faint); font-size: 12px; width: 100%; }
.chip:disabled { opacity: 0.4; cursor: not-allowed; }
.chip:disabled:hover { border-color: var(--border); color: var(--text-dim); }

.notes-edit { border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 8px; }
.note-editor {
  width: 100%;
  min-height: 64px;
  background: var(--panel2);
  border: 1px solid var(--accent);
  color: var(--text);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 12px;
  font-family: inherit;
  resize: vertical;
  outline: none;
}
.mini-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 11px;
  cursor: pointer;
  padding: 4px 0 0;
  text-decoration: underline;
}

.en-ref { border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 8px; }
.en-ref div { font-size: 12px; color: #7a8194; margin-bottom: 3px; font-style: italic; }

.empty { color: var(--text-faint); text-align: center; padding: 40px 0; }
.empty img { width: 120px; opacity: 0.85; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="wrap">
  <h1>TFT Set 18 神火（Wisps）筆記</h1>
  <div class="subtitle">共 <b>176</b> 個（其中 <b>132</b> 個已寫個人筆記，<b>6</b> 個為新內容機翻）　｜　依 MetaTFT 現行資料排序　｜　點下方按鈕篩選</div>

  <div class="controls">
    <div class="row">
      <span class="row-label">階級</span>
      <button class="chip active" data-rar="全部">全部</button>
      <button class="chip" data-rar="白銀">白銀</button>

      <button class="chip" data-rar="稜彩">稜彩</button>
    </div>
    <div class="row">
      <span class="row-label">類別</span>
      <button class="chip active" data-cat="全部">All</button>
      <button class="chip" data-cat="英雄">英雄 Champion</button>
      <button class="chip" data-cat="戰鬥">戰鬥 Combat</button>
      <button class="chip" data-cat="金幣／經驗">金幣經驗 GoldXP</button>
      <button class="chip" data-cat="道具">道具 Item</button>
      <button class="chip" data-cat="雜項">雜項 Misc</button>

    </div>
    <div class="row">
      <span class="row-label">回合</span>

      <button class="chip" data-round="201-207">2-1 to 2-7</button>
      <button class="chip" data-round="301-304">3-1 to 3-4</button>
      <button class="chip" data-round="305-401">3-5 to 4-1</button>
      <button class="chip" data-round="402-407">4-2 to 4-7</button>
      <button class="chip" data-round="501-507">5-1 to 5-7</button>

      <button id="editModeBtn" class="chip">✏️ 編輯模式</button>
      <div id="editTools">

  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <img src="assets/img/choncc_cry.png" alt="">
    <div>沒有符合條件的神火</div>
  </div>

<script src="data/wisps_data.js"></script>
<script>
function roundKey(s) {
  const m = s.trim().match(/(\d+)-(\d+)/);
  if (!m) return null;
  return parseInt(m[1], 10) * 100 + parseInt(m[2], 10);
}
function parseRanges(str) {
  return str.split(/[；;]/).map(seg => {
    const parts = seg.split(/[~～]/);
    if (parts.length < 2) return null;
    return [roundKey(parts[0]), roundKey(parts[1])];
  }).filter(Boolean);
}
function overlaps(ranges, lo, hi) {
  return ranges.some(([a, b]) => a !== null && b !== null && a <= hi && b >= lo);
}

const state = { rarity: '全部', category: '全部', round: '全部', search: '', showUpgrade: true, onlyNoted: false, showEn: false, editMode: false };

const LS_KEY = 'wisp_note_overrides_v1';
function loadOverrides() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; }
}
function saveOverrides() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(overrides)); } catch (e) { /* storage unavailable, ignore */ }
}
let overrides = loadOverrides();

function effectiveNotes(w) {
  return overrides[w.name_en] !== undefined ? overrides[w.name_en] : w.notes;
}
function hasNote(w) {
  const n = effectiveNotes(w);
  return !!(n && n.length);
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, '&quot;');
}

function setupChipGroup(selector, key, attr) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll(selector).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[key] = btn.dataset[attr];
      render();
    });
  });
}
setupChipGroup('.chip[data-rar]', 'rarity', 'rar');
setupChipGroup('.chip[data-cat]', 'category', 'cat');
setupChipGroup('.chip[data-round]', 'round', 'round');

document.getElementById('search').addEventListener('input', e => { state.search = e.target.value.trim(); render(); });
document.getElementById('showUpgrade').addEventListener('change', e => { state.showUpgrade = e.target.checked; render(); });
document.getElementById('onlyNoted').addEventListener('change', e => { state.onlyNoted = e.target.checked; render(); });
document.getElementById('showEn').addEventListener('change', e => { state.showEn = e.target.checked; render(); });

const editModeBtn = document.getElementById('editModeBtn');
const editTools = document.getElementById('editTools');
editModeBtn.addEventListener('click', () => {
  state.editMode = !state.editMode;
  editModeBtn.classList.toggle('active', state.editMode);
  editTools.style.display = state.editMode ? 'flex' : 'none';
  render();
});
document.getElementById('downloadOverrides').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(overrides, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'note_overrides.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

// --- Save straight to data/note_overrides.json on disk via the File System Access API
// (Chrome/Edge only). First click asks you to pick the file once; the handle is then
// kept in IndexedDB so later clicks just write, no repeated picker.
const saveStatus = document.getElementById('saveStatus');
const saveBtn = document.getElementById('saveToFile');
const FS_SUPPORTED = 'showSaveFilePicker' in window;
if (!FS_SUPPORTED) {
  saveBtn.disabled = true;
  saveBtn.title = '這個瀏覽器不支援直接存檔，請用「下載備份」';
  saveStatus.textContent = '這個瀏覽器不支援直接存檔（File System Access API），請改用「下載備份」再手動覆蓋 data/note_overrides.json。';
}

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('wisp_notes_fs', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetHandle() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readonly');
    const r = tx.objectStore('handles').get('note_overrides_handle');
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}
async function idbSetHandle(handle) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(handle, 'note_overrides_handle');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

let fileHandle = null;
async function ensureFileHandle() {
  if (fileHandle && await fileHandle.requestPermission({ mode: 'readwrite' }) === 'granted') {
    return fileHandle;
  }
  try {
    const saved = await idbGetHandle();
    if (saved && await saved.requestPermission({ mode: 'readwrite' }) === 'granted') {
      fileHandle = saved;
      return fileHandle;
    }
  } catch (e) { /* no saved handle yet, fall through */ }
  fileHandle = await window.showSaveFilePicker({
    suggestedName: 'note_overrides.json',
    types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
  });
  await idbSetHandle(fileHandle);
  return fileHandle;
}

if (FS_SUPPORTED) {
  saveBtn.addEventListener('click', async () => {
    saveStatus.textContent = '儲存中…';
    try {
      const handle = await ensureFileHandle();
      // Merge with whatever is already on disk first -- other machines/sessions may have
      // saved keys this browser's localStorage never had, and a blind overwrite would drop them.
      let diskData = {};
      try {
        const file = await handle.getFile();
        const text = await file.text();
        if (text.trim()) diskData = JSON.parse(text);
      } catch (e) { /* file empty/unreadable/new -- start from {} */ }
      const merged = Object.assign({}, diskData, overrides);
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(merged, null, 2));
      await writable.close();
      overrides = merged;
      saveOverrides();
      saveStatus.textContent = `已存檔（${new Date().toLocaleTimeString('zh-TW')}），可以叫 Claude update 了。`;
      render();
    } catch (e) {
      if (e.name === 'AbortError') {
        saveStatus.textContent = '已取消。';
        return;
      }
      saveStatus.textContent = '存檔失敗：' + e.message + '（改用「下載備份」）';
    }
  });
}
document.getElementById('clearOverrides').addEventListener('click', () => {
  if (!confirm('確定要清除這個瀏覽器裡儲存的所有本機修改嗎？此動作無法復原（建議先按左邊「下載」備份）。')) return;
  overrides = {};
  saveOverrides();
  render();
});

const gridEl = document.getElementById('grid');
gridEl.addEventListener('input', e => {
  if (!e.target.classList.contains('note-editor')) return;
  const name = e.target.dataset.name;
  const lines = e.target.value.split('\n').map(s => s.trim()).filter(Boolean);
  overrides[name] = lines;
  saveOverrides();
});
gridEl.addEventListener('focusout', e => {
  if (!e.target.classList.contains('note-editor')) return;
  render();
});
gridEl.addEventListener('click', e => {
  if (!e.target.classList.contains('reset-note')) return;
  delete overrides[e.target.dataset.name];
  saveOverrides();
  render();
});

function matches(w) {
  if (state.onlyNoted && !hasNote(w)) return false;
  if (state.rarity !== '全部' && w.rarity !== state.rarity) return false;
  if (state.category !== '全部' && w.category !== state.category) return false;
  if (state.round !== '全部') {
    const [lo, hi] = state.round.split('-').map(Number);
    if (!overlaps(parseRanges(w.round_range), lo, hi)) return false;
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    const hay = (w.name + ' ' + w.name_en + ' ' + w.effects.join(' ') + ' ' + effectiveNotes(w).join(' ')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function effectClass(line, idx) {
  if (line.startsWith('稜彩')) return 'prism';
  if (idx > 0) return 'upgrade';
  return '';
}

function card(w) {
  const effects = state.showUpgrade ? w.effects : w.effects.slice(0, 1);
  const cost = (w.cost === '—' || w.cost === '') ? '免費' : w.cost + ' 元';
  const enBlock = state.showEn ? `<div class="en-ref">
      <div>EN: ${w.effect_en_base || ''}</div>
      ${w.effect_en_blossom ? `<div>Blossom upgrade: ${w.effect_en_blossom}</div>` : ''}
      ${w.conditions_en ? `<div>Only appears if: ${w.conditions_en}</div>` : ''}
    </div>` : '';

  const isOverridden = overrides[w.name_en] !== undefined;
  const notes = effectiveNotes(w);
  let notesBlock;
  if (state.editMode) {
    notesBlock = `<div class="notes-edit">
      <textarea class="note-editor" data-name="${escapeAttr(w.name_en)}" rows="3" placeholder="每行一則備註，例如：【備註】必拿。">${escapeHtml(notes.join('\n'))}</textarea>
      ${isOverridden ? `<button class="mini-btn reset-note" data-name="${escapeAttr(w.name_en)}">還原成原始筆記</button>` : ''}
    </div>`;
  } else if (notes.length) {
    notesBlock = `<div class="notes">
      ${isOverridden ? '<span class="local-flag">本機修改</span><br>' : ''}
      ${notes.map(n => `<div>${n}</div>`).join('')}
    </div>`;
  } else if (w.official_zh_source) {
    notesBlock = `<div class="notes"><div style="color:var(--text-faint); font-style:italic;">（尚無個人筆記）</div></div>`;
  } else {
    notesBlock = '';
  }

  return `<div class="card">
    <div class="card-head">
      <div class="card-name-row">
        <img class="card-icon" src="assets/icons/${w.icon}" alt="${w.category}">
        <div>
          <div class="card-name">${w.name}</div>
          <div class="card-name-en">${w.name_en}</div>
        </div>
      </div>
      <div class="card-cost">${cost}</div>
    </div>
    <div class="badges">
      <span class="badge cat-${w.category}">${w.category}</span>
      <span class="badge rar-${w.rarity}">${w.rarity}</span>
      <span class="badge round">${w.round_range}</span>
      ${!w.official_zh_source ? '<span class="badge fresh">新內容／機翻</span>' : ''}
    </div>
    <ul class="effects">${effects.map((e,i) => `<li class="${effectClass(e,i)}">${e}</li>`).join('')}</ul>
    ${notesBlock}
    ${enBlock}
  </div>`;
}

function render() {
  const filtered = WISPS.filter(matches);
  document.getElementById('count').textContent = `顯示 ${filtered.length} / ${WISPS.length} 條`;
  document.getElementById('grid').innerHTML = filtered.map(card).join('');
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';
}
render();
</script>
</body>
